# UART to Linux (LPUART1 <-> /dev/ttyHS1, owned by arduino-router there),
# interrupt-driven RX into a ring buffer, MessagePack-RPC on top.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# LED matrix: charlieplexed on GPIOF, scanned from a TIM17 counter interrupt.
CONFIG_GPIO=y
CONFIG_COUNTER=y

# Boot banner and logs go to the board console (USART1, D0/D1 header pins).
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HW_STACK_PROTECTION=y
