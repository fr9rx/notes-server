# OpenOCD script used on the UNO Q itself to flash zephyr.elf into the STM32U585
# over SWD (via the board's `remoteocd` wrapper, which supplies the GPIO SWD
# interface and target config). Replaces whatever is at 0x08000000, including
# Arduino's sketch loader; to go back to Arduino sketches, flash the loader
# again with `arduino-cli burn-bootloader -b arduino:zephyr:unoq -P remoteocd`
# or deploy\deploy-unoq.ps1 -RestoreArduinoLoader.
#
#   remoteocd upload -f flash.cfg zephyr.elf
reset_config srst_only srst_nogate srst_push_pull connect_assert_srst
init
# Halt at the reset vector, before running firmware can reconfigure clocks or
# sleep: a separate "reset; halt" made the flash algorithm time out.
reset halt
flash write_image erase ${filename0}
verify_image ${filename0}
reset
shutdown
